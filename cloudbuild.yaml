steps:
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'buildx'
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '$_IMAGE_TAG'
      - '-t'
      - '$_IMAGE_LATEST_TAG'
      - './src'

images:
  - '$_IMAGE_TAG'
  - '$_IMAGE_LATEST_TAG'
